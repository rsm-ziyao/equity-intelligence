[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-intelligence-backend"
version = "0.1.0"
description = "Equity Intelligence backend service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.114.0",
  "uvicorn[standard]==0.23.2",
  "pytest==8.4.0",
  "httpx==0.27.0",
  "sqlalchemy==2.0.31",
  "psycopg2-binary==2.9.12",
  "python-dotenv==1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
